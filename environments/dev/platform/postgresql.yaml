apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.16-standard-trixie@sha256:0848a2f80eb48d9bff76857ce988a6053b4120e7ecbdc4414e24cb1cd2df0754
  enableSuperuserAccess: false
  managed:
    roles:
    - name: identity_srv
      ensure: present
      login: true
      superuser: false
      passwordSecret:
        name: identity-database
    - name: shop_srv
      ensure: present
      login: true
      superuser: false
      passwordSecret:
        name: shop-database
    - name: product_srv
      ensure: present
      login: true
      superuser: false
      passwordSecret:
        name: product-database
    - name: store_srv
      ensure: present
      login: true
      superuser: false
      passwordSecret:
        name: store-database
    - name: cart_srv
      ensure: present
      login: true
      superuser: false
      passwordSecret:
        name: cart-database
    - name: file_srv
      ensure: present
      login: true
      superuser: false
      passwordSecret:
        name: file-database
  bootstrap:
    initdb:
      database: socket_srv
      owner: socket_srv
      secret:
        name: socket-database
  storage:
    size: 10Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
