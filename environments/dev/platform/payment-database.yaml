apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: payment-database
spec:
  cluster:
    name: postgresql
  name: payment_srv
  owner: payment_srv
  template: template0
  encoding: UTF8
  localeCollate: C.UTF-8
  localeCType: C.UTF-8
  ensure: present
  databaseReclaimPolicy: retain
