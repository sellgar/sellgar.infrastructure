- name: Provision missing platform credentials without rotating existing secrets
  hosts: control
  gather_facts: false
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ kubeconfig_path }}"
  tasks:
  - name: Create the application namespace
    kubernetes.core.k8s:
      definition:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: "{{ kubernetes_namespace }}"

  - name: Provision database and storage identities
    ansible.builtin.include_tasks: tasks/secret.yml
    loop:
    - {name: socket-database, username: socket_srv}
    - {name: identity-database, username: identity_srv}
    - {name: shop-database, username: shop_srv}
    - {name: product-database, username: product_srv}
    - {name: store-database, username: store_srv}
    - {name: cart-database, username: cart_srv}
    - {name: order-database, username: order_srv}
    - {name: payment-database, username: payment_srv}
    - {name: file-database, username: file_srv}
    - {name: media-storage, username: sellgar-media}
    - {name: minio-root, username: sellgar-admin}
    vars:
      secret_name: "{{ item.name }}"
      secret_type: kubernetes.io/basic-auth
      secret_labels: "{{ {'cnpg.io/reload': 'true'} if item.name.endswith('-database') else {} }}"
      secret_values:
        username: "{{ item.username }}"
        password: "{{ lookup('ansible.builtin.password', '/dev/null', length=64, chars=['ascii_lowercase', 'digits']) }}"

  - name: Provision signing keys
    ansible.builtin.include_tasks: tasks/secret.yml
    no_log: true
    loop:
    - name: identity-auth
      values:
        password-hmac-secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=96) }}"
        session-hash-key: "{{ lookup('ansible.builtin.password', '/dev/null', length=96) }}"
        fingerprint-storage-secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=96) }}"
    - name: socket-auth
      values:
        ticket-secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=96) }}"
    - name: admin-auth
      values:
        fingerprint-secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=96) }}"
    vars:
      secret_name: "{{ item.name }}"
      secret_type: Opaque
      secret_values: "{{ item['values'] }}"

  - name: Provision independent pagination signing keys
    ansible.builtin.include_tasks:
      file: tasks/secret.yml
      apply:
        tags: [pagination]
    tags: [pagination]
    no_log: true
    loop: [product, store, shop, cart, file]
    vars:
      secret_name: "{{ item }}-pagination"
      secret_type: Opaque
      secret_values:
        token-secret: "{{ lookup('ansible.builtin.password', '/dev/null', length=96, chars=['ascii_letters', 'digits']) }}"
